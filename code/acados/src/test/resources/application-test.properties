# Test Configuration with H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:acados_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never

# Security test properties
acados.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
acados.jwt.expiration-ms=86400000

# Mail test properties
