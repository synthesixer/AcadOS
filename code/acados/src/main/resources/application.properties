# ==========================================
# Application & Server Configuration
# ==========================================
spring.application.name=acados
server.port=${PORT:8080}

# ==========================================
# Database Configuration (MySQL 8.x / Cloud MySQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/acados_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================
# Database Migration (Flyway)
# ==========================================
spring.flyway.enabled=false

# ==========================================
# SQL Initialization Configuration (Seed Data)
# ==========================================
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=true

# ==========================================
# OpenAPI 3 / Swagger Documentation
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# Spring Boot Actuator
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ==========================================
# Email Service (Mailtrap Sandbox SMTP)
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:mailtrap_user}
spring.mail.password=${SPRING_MAIL_PASSWORD:mailtrap_pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# JWT Security Configuration
# ==========================================
acados.jwt.secret=${ACADOS_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
acados.jwt.expiration-ms=${ACADOS_JWT_EXPIRATION_MS:86400000}

# ==========================================
# External Public Holiday API (ThailandFormats)
# ==========================================
acados.holiday.api.base-url=${ACADOS_HOLIDAY_API_BASE_URL:https://thailandformats.com/api/v1}

# ==========================================
# Thymeleaf Configuration
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
