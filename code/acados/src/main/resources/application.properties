# ==========================================
# Application & Server Configuration
# ==========================================
spring.application.name=acados
server.port=8080

# ==========================================
# Database Configuration (MySQL 8.x)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/acados_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Database Migration (Flyway)
# ==========================================
spring.flyway.enabled=false

# ==========================================
# OpenAPI 3 / Swagger Documentation
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# Spring Boot Actuator
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ==========================================
# Email Service (Mailtrap Sandbox SMTP)
# ==========================================
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=mailtrap_user
spring.mail.password=mailtrap_pass
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# JWT Security Configuration
# ==========================================
acados.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
acados.jwt.expiration-ms=86400000

# ==========================================
# Thymeleaf Configuration
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
