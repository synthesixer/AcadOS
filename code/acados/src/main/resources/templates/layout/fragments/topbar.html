<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- Topbar: Task Ribbon with live operational indicators -->
<header th:fragment="topbar" class="topbar">
    <button type="button" class="btn btn--secondary btn--sm topbar__menu" id="menu-toggle"
            aria-controls="sidebar" aria-expanded="false" aria-label="เปิด/ปิดเมนูนำทาง">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        เมนู
    </button>

    <!-- Operational Context Indicator -->
    <div class="topbar__context-pill" title="ระบบเชื่อมต่อฐานข้อมูล MySQL และ Real-time Observer">
        <span class="topbar__sync-dot"></span>
        <span>ระบบพร้อมใช้งาน · ภาค 1/2569</span>
    </div>

    <div class="topbar__spacer"></div>

    <div class="topbar__actions">
        <!-- Context Strip Toggle Button -->
        <button type="button" class="btn btn--secondary btn--sm" id="topbar-context-toggle" title="เปิด/ปิด แถบข้อมูลสรุป" style="font-size:0.82rem;">
            ℹ บริบท
        </button>

        <th:block sec:authorize="isAuthenticated()">
            <a class="bell" th:href="@{/notifications}" aria-label="ดูการแจ้งเตือน">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="bell__count hidden" id="unread-count">0</span>
            </a>

            <button type="button" class="topbar__user" id="topbar-user-badge" onclick="ui.openProfileModal()" title="คลิกเพื่อดูข้อมูลผู้ใช้ เปลี่ยนรหัสผ่าน หรือเลือก Preference" style="background:none; border:none; cursor:pointer; text-align:left;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <!-- Shows login id from Spring Security (e.g. S001 / T001 / admin) -->
                <span class="topbar__name" id="current-user-name" sec:authentication="name">ผู้ใช้</span>
                <span class="badge badge--info" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="badge badge--info" sec:authorize="hasRole('TEACHER')">TEACHER</span>
                <span class="badge badge--info" sec:authorize="hasRole('STUDENT')">STUDENT</span>
            </button>

            <button type="button" class="btn btn--secondary btn--sm" id="logout-button">ออกจากระบบ</button>
        </th:block>

        <th:block sec:authorize="isAnonymous()">
            <button type="button" class="topbar__user hidden" id="client-user-badge" onclick="ui.openProfileModal()" title="คลิกเพื่อดูข้อมูลผู้ใช้ เปลี่ยนรหัสผ่าน หรือเลือก Preference" style="background:none; border:none; cursor:pointer; text-align:left;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="topbar__name" id="client-user-name">ผู้ใช้</span>
                <span class="badge badge--info" id="client-user-role"></span>
            </button>
            <button type="button" class="btn btn--secondary btn--sm hidden" id="client-logout-button">ออกจากระบบ</button>
            <a class="btn btn--primary btn--sm" id="guest-login-btn" th:href="@{/login}">เข้าสู่ระบบ</a>
        </th:block>
    </div>
</header>
</body>
</html>
