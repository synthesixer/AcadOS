<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เข้าสู่ระบบ | AcadOS</title>
    <style>
        :root{font-family:Arial,"IBM Plex Sans Thai",sans-serif;color:#1e293b;background:#f1f5f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,420px);background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:32px;box-shadow:0 16px 48px #0f172a12}.brand{font-size:1.6rem;font-weight:700;color:#1f5f8b;margin:0 0 8px}p{color:#64748b;margin:0 0 24px}label{display:block;font-weight:600;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{width:100%;border:0;border-radius:8px;background:#1f5f8b;color:white;padding:12px;margin-top:22px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{color:#b42318;min-height:1.5em;margin-top:12px}.back{display:block;margin-top:18px;text-align:center;color:#1f5f8b}
    </style>
</head>
<body>
<main class="panel">
    <h1 class="brand">AcadOS</h1>
    <p>เข้าสู่ระบบด้วย University ID และรหัสผ่าน</p>
    <form id="login-form">
        <label for="university-id">University ID</label>
        <input id="university-id" name="universityId" autocomplete="username" required>
        <label for="password">รหัสผ่าน</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit-button" type="submit">เข้าสู่ระบบ</button>
        <div class="error" id="login-error" role="alert" aria-live="polite"></div>
    </form>
    <a class="back" th:href="@{/}">กลับหน้าหลัก</a>
</main>
<script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const button = document.getElementById('submit-button');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';
        button.disabled = true;
        try {
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
                body: JSON.stringify({
                    universityId: form.elements.universityId.value.trim(),
                    password: form.elements.password.value
                })
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(payload.message || 'University ID หรือรหัสผ่านไม่ถูกต้อง');
            }
            sessionStorage.setItem('acadosToken', payload.token);
            sessionStorage.setItem('acadosRole', payload.role);
            const destinations = {
                ADMIN: '/admin/dashboard',
                TEACHER: '/teacher/dashboard',
                STUDENT: '/student/dashboard'
            };
            window.location.assign(destinations[payload.role] || '/');
        } catch (error) {
            errorBox.textContent = error.message || 'ไม่สามารถเชื่อมต่อระบบได้';
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
