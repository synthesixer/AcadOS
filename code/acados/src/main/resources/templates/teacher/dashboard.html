<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher Dashboard | AcadOS</title>
    <style>
        :root{font-family:Arial,"IBM Plex Sans Thai",sans-serif;color:#1e293b;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}.bar{display:flex;align-items:center;justify-content:space-between;padding:16px max(24px,calc((100% - 1000px)/2));background:#fff;border-bottom:1px solid #dbe3ee}.brand{font-weight:700;color:#1f5f8b;text-decoration:none;font-size:1.25rem}.bar nav{display:flex;gap:16px;align-items:center}.bar nav a{color:#1f5f8b;text-decoration:none}.bar button,.primary{border:0;border-radius:8px;background:#1f5f8b;color:#fff;padding:10px 14px;font:inherit;cursor:pointer}.wrap{max-width:1000px;margin:32px auto;padding:0 20px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:24px 0}.card{background:white;border:1px solid #dbe3ee;border-radius:12px;padding:20px}.card h2{margin-top:0;font-size:1.1rem}.list{display:grid;gap:10px}.item{border:1px solid #e2e8f0;border-radius:8px;padding:12px;overflow-wrap:anywhere}.error{color:#b42318}.status{font-size:.9rem;color:#475569}footer{padding:24px;text-align:center;color:#64748b}@media(max-width:520px){.bar{align-items:flex-start;gap:12px}.bar nav{gap:8px;flex-wrap:wrap;justify-content:flex-end}}
    </style>
</head>
<body>
<header class="bar">
    <a class="brand" th:href="@{/}">AcadOS</a>
    <nav aria-label="เมนูอาจารย์">
        <a th:href="@{/teacher/dashboard}">หน้าหลัก</a>
        <a th:href="@{/teacher/swaps}">แลกคาบสอน</a>
        <button id="logout-button" type="button">ออกจากระบบ</button>
    </nav>
</header>
<main class="wrap">
    <h1>Teacher Dashboard</h1>
    <p class="muted">ดูตารางสอนและไปยังคำขอแลกคาบของคุณ</p>
    <section class="grid" aria-label="เมนูอาจารย์">
        <article class="card"><h2>ตารางสอน</h2><p class="muted">แสดงตารางที่เผยแพร่แล้วของอาจารย์ที่เข้าสู่ระบบ</p><a class="primary" th:href="@{/teacher/swaps}">จัดการคำขอแลกคาบ</a></article>
        <article class="card"><h2>คำขอแลกคาบ</h2><p class="muted">ดูคำขอที่ส่งและคำขอที่ส่งถึงคุณ</p><a th:href="@{/teacher/swaps}">เปิดหน้าแลกคาบ</a></article>
    </section>
    <section class="card">
        <h2>ตารางสอนที่เผยแพร่</h2>
        <p id="schedule-message" class="status" aria-live="polite">กำลังโหลดตารางสอน…</p>
        <div id="schedule-list" class="list"></div>
    </section>
</main>
<footer>AcadOS · Teacher</footer>
<script>
    const token = sessionStorage.getItem('acadosToken');
    const role = sessionStorage.getItem('acadosRole');
    if (!token || role !== 'TEACHER') window.location.replace('/login');

    document.getElementById('logout-button').addEventListener('click', () => {
        sessionStorage.removeItem('acadosToken');
        sessionStorage.removeItem('acadosRole');
        window.location.assign('/login');
    });

    async function loadSchedules() {
        const message = document.getElementById('schedule-message');
        const list = document.getElementById('schedule-list');
        try {
            const response = await fetch('/api/v1/schedules', {
                headers: {Authorization: 'Bearer ' + token, Accept: 'application/json'}
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok) throw new Error(payload && payload.message ? payload.message : 'โหลดตารางสอนไม่สำเร็จ');
            const schedules = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.content) ? payload.content : []);
            if (!schedules.length) {
                message.textContent = 'ยังไม่มีตารางสอนที่แสดงได้';
                return;
            }
            message.textContent = '';
            schedules.forEach((schedule) => {
                const item = document.createElement('div');
                item.className = 'item';
                const sectionId = schedule.section && schedule.section.id != null ? schedule.section.id : '—';
                const slotId = schedule.timeSlot && schedule.timeSlot.id != null ? schedule.timeSlot.id : '—';
                item.textContent = 'Schedule #' + schedule.id + ' · Section #' + sectionId + ' · Time slot #' + slotId + ' · ' + (schedule.status || '');
                list.appendChild(item);
            });
        } catch (error) {
            message.textContent = error.message || 'โหลดตารางสอนไม่สำเร็จ';
            message.classList.add('error');
        }
    }
    loadSchedules();
</script>
</body>
</html>
