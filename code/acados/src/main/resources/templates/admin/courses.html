<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>จัดการรายวิชา | AcadOS</title>
</head>
<body>
<main>
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; margin-bottom:24px;">
        <div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                <span style="font-size:0.8rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--teal-primary);">Catalog & Curriculum</span>
            </div>
            <h1 style="font-size:1.75rem; font-weight:700; color:var(--ink-navy); margin:0;">จัดการรายวิชา (Course Catalog)</h1>
            <p class="muted" style="margin:4px 0 0; font-size:0.95rem;">กำหนดข้อมูลรายวิชาในหลักสูตร รหัสวิชา และชั่วโมงเรียนต่อสัปดาห์</p>
        </div>
    </div>

    <!-- Create Course Card -->
    <div class="card" style="padding:20px; margin-bottom:24px;">
        <h3 style="margin:0 0 4px; font-size:1.1rem; color:var(--ink-navy);">เพิ่มรายวิชาใหม่ในหลักสูตร</h3>
        <p class="muted" style="margin:0 0 16px; font-size:0.88rem;">กรอกรหัสวิชาตามมาตรฐานสถาบัน (เช่น CP353002) ชื่อวิชา และจำนวนชั่วโมงสอนต่อสัปดาห์</p>

        <form id="create-course-form" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; align-items:flex-end;">
            <div>
                <label for="course-code" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">รหัสวิชา</label>
                <input id="course-code" placeholder="เช่น CP353002" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div style="grid-column: span 2;">
                <label for="course-title" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">ชื่อวิชา</label>
                <input id="course-title" placeholder="เช่น Software Quality Assurance" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div>
                <label for="course-hours" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">ชั่วโมง/สัปดาห์</label>
                <input id="course-hours" type="number" min="1" max="10" value="3" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div>
                <button class="btn btn--primary" type="submit" id="btn-create-course" style="width:100%; height:40px;">
                    + เพิ่มรายวิชา
                </button>
            </div>
        </form>
    </div>

    <!-- Course Catalog Ledger -->
    <div class="card" style="padding:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
            <div style="display:flex; align-items:center; gap:8px;">
                <h3 style="margin:0; font-size:1.1rem; color:var(--ink-navy);">รายวิชาทั้งหมด</h3>
                <span class="muted" style="font-size:0.85rem;">(<span class="num" id="course-count">0</span> รายการ)</span>
            </div>
            <div>
                <input type="text" id="course-filter" placeholder="ค้นหารหัสวิชา หรือชื่อวิชา..." 
                       style="padding:7px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.88rem; width:220px;"
                       oninput="renderFilteredCourses()">
            </div>
        </div>

        <div id="course-list" style="display:grid; gap:10px;">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- Edit Course Modal -->
    <div class="modal-backdrop" id="edit-course-backdrop" onclick="closeEditCourseModal()"></div>
    <div class="modal-dialog" id="edit-course-modal" role="dialog" aria-modal="true" style="max-width:520px;">
        <div class="modal-dialog__header">
            <h3 style="margin:0; font-size:1.15rem; color:var(--ink-navy);">แก้ไขรายวิชา (Edit Course)</h3>
            <button type="button" class="btn btn--secondary btn--sm" onclick="closeEditCourseModal()">✕</button>
        </div>
        <form id="edit-course-form">
            <div class="modal-dialog__body" style="display:flex; flex-direction:column; gap:14px;">
                <input type="hidden" id="edit-course-id">
                <div>
                    <label for="edit-course-code" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">รหัสวิชา *</label>
                    <input id="edit-course-code" required
                           style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
                </div>
                <div>
                    <label for="edit-course-title" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">ชื่อวิชา *</label>
                    <input id="edit-course-title" required
                           style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
                </div>
                <div>
                    <label for="edit-course-hours" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">ชั่วโมง/สัปดาห์ *</label>
                    <input id="edit-course-hours" type="number" min="1" max="10" required
                           style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
                </div>
            </div>
            <div class="modal-dialog__footer" style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" class="btn btn--secondary" onclick="closeEditCourseModal()">ยกเลิก</button>
                <button type="submit" class="btn btn--primary" id="btn-submit-edit-course">บันทึกการแก้ไข</button>
            </div>
        </form>
    </div>
</main>

<script>
    let allCourses = [];

    function openEditCourseModal(c) {
        document.getElementById('edit-course-id').value = c.id;
        document.getElementById('edit-course-code').value = c.courseCode || '';
        document.getElementById('edit-course-title').value = c.title || '';
        document.getElementById('edit-course-hours').value = c.weeklyHours || 3;

        document.getElementById('edit-course-backdrop').classList.add('is-open');
        document.getElementById('edit-course-modal').classList.add('is-open');
    }

    function closeEditCourseModal() {
        document.getElementById('edit-course-backdrop').classList.remove('is-open');
        document.getElementById('edit-course-modal').classList.remove('is-open');
    }

    function renderFilteredCourses() {
        const list = document.getElementById('course-list');
        const query = (document.getElementById('course-filter').value || '').trim().toLowerCase();

        let filtered = allCourses.filter(c => {
            if (!query) return true;
            return (c.courseCode || '').toLowerCase().includes(query) || 
                   (c.title || '').toLowerCase().includes(query);
        });

        if (filtered.length === 0) {
            ui.renderEmpty(list, 'ไม่พบรายวิชาที่ตรงกับการค้นหา');
            return;
        }

        list.innerHTML = '';
        filtered.forEach(c => {
            const item = document.createElement('div');
            item.style.padding = '14px 18px';
            item.style.background = 'var(--surface)';
            item.style.border = '1px solid var(--border-subtle)';
            item.style.borderLeft = '4px solid var(--teal-primary)';
            item.style.borderRadius = '8px';
            item.style.display = 'flex';
            item.style.justifyContent = 'space-between';
            item.style.alignItems = 'center';
            item.style.flexWrap = 'wrap';
            item.style.gap = '12px';

            item.innerHTML = `
                <div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="mono" style="font-weight:700; font-size:1.05rem; color:var(--ink-navy);">${ui.escapeHtml(c.courseCode)}</span>
                        <span style="font-weight:600; color:var(--ink-navy); font-size:0.95rem;">${ui.escapeHtml(c.title)}</span>
                        <span class="muted mono" style="font-size:0.75rem;">ID: #${c.id}</span>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:0.85rem; font-weight:500; color:var(--slate-neutral); background:var(--bg-canvas); padding:3px 10px; border-radius:4px; border:1px solid var(--border-subtle);">
                        <span class="num">${c.weeklyHours}</span> ชม./สัปดาห์
                    </span>
                    <button type="button" class="btn btn--secondary btn--sm" onclick='openEditCourseModal(${JSON.stringify(c)})'>
                        ✏ แก้ไข
                    </button>
                    <button type="button" class="btn btn--danger btn--sm" onclick="deleteCourse(${c.id}, '${ui.escapeHtml(c.courseCode)}')">
                        ลบ
                    </button>
                </div>
            `;
            list.appendChild(item);
        });
    }

    function deleteCourse(id, code) {
        ui.openDecisionSheet({
            title: `ยืนยันลบรายวิชา ${code}`,
            desc: `คุณกำลังจะลบรายวิชา #${id} ออกจากหลักสูตร`,
            impacts: ['รายวิชานี้จะถูกนำออกจากระบบ (ต้องไม่มีกลุ่มเรียนที่ใช้งานอยู่)'],
            confirmText: 'ยืนยันลบรายวิชา',
            confirmClass: 'btn--danger',
            onConfirm: async () => {
                const res = await api.del(`/api/v1/courses/${id}`);
                if (res.ok) {
                    ui.toast('success', `ลบรายวิชา ${code} เรียบร้อยแล้ว`);
                    await loadCourses();
                } else {
                    ui.toast('error', res.error.message || 'ไม่สามารถลบรายวิชาได้');
                }
            }
        });
    }

    document.getElementById('edit-course-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-course-id').value;
        const btn = document.getElementById('btn-submit-edit-course');
        ui.setBusy(btn, true);

        const payload = {
            courseCode: document.getElementById('edit-course-code').value.trim(),
            title: document.getElementById('edit-course-title').value.trim(),
            weeklyHours: Number(document.getElementById('edit-course-hours').value)
        };

        const res = await api.put(`/api/v1/courses/${id}`, payload);
        ui.setBusy(btn, false);

        if (res.ok) {
            ui.toast('success', `แก้ไขรายวิชา ${payload.courseCode} สำเร็จ`);
            closeEditCourseModal();
            await loadCourses();
        } else {
            ui.toast('error', res.error.message || 'ไม่สามารถแก้ไขรายวิชาได้');
        }
    });

    async function loadCourses() {
        const list = document.getElementById('course-list');
        ui.renderLoading(list, 3);
        const res = await api.get('/api/v1/courses?page=0&size=50');
        if (!res.ok) {
            ui.renderError(list, res.error);
            return;
        }

        allCourses = (res.data && res.data.content) ? res.data.content : (Array.isArray(res.data) ? res.data : []);
        document.getElementById('course-count').textContent = allCourses.length;
        renderFilteredCourses();
    }

    document.getElementById('create-course-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-create-course');
        ui.setBusy(btn, true);

        const res = await api.post('/api/v1/courses', {
            courseCode: document.getElementById('course-code').value.trim(),
            title: document.getElementById('course-title').value.trim(),
            weeklyHours: parseInt(document.getElementById('course-hours').value)
        });
        ui.setBusy(btn, false);

        if (res.ok) {
            ui.toast('success', 'เพิ่มรายวิชาสำเร็จ');
            document.getElementById('create-course-form').reset();
            document.getElementById('course-hours').value = '3';
            await loadCourses();
        } else {
            ui.toast('error', res.error.message || 'เกิดข้อผิดพลาดในการเพิ่มรายวิชา');
        }
    });

    loadCourses();
</script>
</body>
</html>
