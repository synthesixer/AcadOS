<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>จัดการรายวิชา | AcadOS</title>
</head>
<body>
<main>
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <div>
            <h1>จัดการรายวิชา (Courses)</h1>
            <p class="muted">รายวิชาทั้งหมดในหลักสูตร</p>
        </div>
    </div>

    <div class="card" style="margin-bottom:24px;">
        <h3>เพิ่มรายวิชาใหม่</h3>
        <form id="create-course-form" style="display:flex; gap:12px; margin-top:12px; flex-wrap:wrap;">
            <input id="course-code" placeholder="รหัสวิชา (e.g. CP353002)" required style="padding:8px 12px; border:1px solid var(--border); border-radius:6px;">
            <input id="course-title" placeholder="ชื่อวิชา" required style="padding:8px 12px; border:1px solid var(--border); border-radius:6px; flex:1;">
            <input id="course-hours" type="number" min="1" placeholder="ชั่วโมง/สัปดาห์" required value="3" style="width:120px; padding:8px 12px; border:1px solid var(--border); border-radius:6px;">
            <button class="btn btn--primary" type="submit">เพิ่มวิชา</button>
        </form>
    </div>

    <div class="card">
        <h3>รายวิชาทั้งหมด</h3>
        <div id="course-list" style="margin-top:12px; display:grid; gap:8px;"></div>
    </div>
</main>

<script>
    async function loadCourses() {
        const list = document.getElementById('course-list');
        const res = await api.get('/api/v1/courses?page=0&size=50');
        if (!res.ok) {
            list.innerHTML = `<p style="color:var(--danger);">${res.error.message}</p>`;
            return;
        }
        const courses = (res.data && res.data.content) ? res.data.content : (Array.isArray(res.data) ? res.data : []);
        list.innerHTML = '';
        courses.forEach(c => {
            const item = document.createElement('div');
            item.style.padding = '10px 14px';
            item.style.border = '1px solid var(--border)';
            item.style.borderRadius = '6px';
            item.style.display = 'flex';
            item.style.justifyContent = 'space-between';
            item.innerHTML = `<strong>${c.courseCode}</strong> <span>${c.title}</span> <span class="muted">${c.weeklyHours} ชม./สัปดาห์</span>`;
            list.appendChild(item);
        });
    }

    document.getElementById('create-course-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await api.post('/api/v1/courses', {
            courseCode: document.getElementById('course-code').value.trim(),
            title: document.getElementById('course-title').value.trim(),
            weeklyHours: parseInt(document.getElementById('course-hours').value)
        });
        if (res.ok) {
            alert('เพิ่มรายวิชาสำเร็จ');
            document.getElementById('create-course-form').reset();
            loadCourses();
        } else {
            alert(res.error.message);
        }
    });

    loadCourses();
</script>
</body>
</html>
