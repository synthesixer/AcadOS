<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>จัดการห้องเรียน | AcadOS</title>
</head>
<body>
<main>
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; margin-bottom:24px;">
        <div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                <span style="font-size:0.8rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--teal-primary);">Facilities & Infrastructure</span>
            </div>
            <h1 style="font-size:1.75rem; font-weight:700; color:var(--ink-navy); margin:0;">จัดการห้องเรียน (Rooms & Facilities)</h1>
            <p class="muted" style="margin:4px 0 0; font-size:0.95rem;">ข้อมูลอาคาร ชั้น และความจุที่นั่งสำหรับจัดสรรตารางสอนและสอบ</p>
        </div>
    </div>

    <!-- Create Room Card -->
    <div class="card" style="padding:22px; margin-bottom:24px;">
        <h3 style="margin:0 0 4px; font-size:1.15rem; color:var(--ink-navy);">เพิ่มห้องเรียนใหม่</h3>
        <p class="muted" style="margin:0 0 16px; font-size:0.88rem;">ระบุหมายเลขห้อง อาคาร ชั้น และความจุที่นั่งเพื่อใช้จัดสรรตารางสอนอัตโนมัติ</p>

        <form id="create-room-form" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; align-items:flex-end;">
            <div>
                <label for="room-number" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">หมายเลขห้อง (Room Number) *</label>
                <input id="room-number" placeholder="เช่น 201, LAB-1" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div>
                <label for="room-building" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">อาคาร (Building) *</label>
                <input id="room-building" placeholder="เช่น SC, อาคารวิทยาศาสตร์" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div>
                <label for="room-floor" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">ชั้น (Floor) *</label>
                <input id="room-floor" type="number" min="1" max="50" value="2" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div>
                <label for="room-capacity" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">ความจุที่นั่ง (Capacity) *</label>
                <input id="room-capacity" type="number" min="1" max="1000" value="50" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div>
                <button class="btn btn--primary" type="submit" id="btn-create-room" style="width:100%; height:40px;">
                    + เพิ่มห้องเรียน
                </button>
            </div>
        </form>
    </div>

    <!-- Rooms Ledger Workbench -->
    <div class="card" style="padding:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
            <div style="display:flex; align-items:center; gap:8px;">
                <h3 style="margin:0; font-size:1.1rem; color:var(--ink-navy);">ห้องเรียนทั้งหมดในระบบ</h3>
                <span class="muted" style="font-size:0.85rem;">(<span class="num" id="room-count">0</span> ห้อง)</span>
            </div>
            <div>
                <input type="text" id="room-filter" placeholder="ค้นหาห้อง หรืออาคาร..." 
                       style="padding:7px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.88rem; width:220px;"
                       oninput="renderFilteredRooms()">
            </div>
        </div>

        <div id="room-list" style="display:grid; gap:10px;">
            <!-- Rendered by JS -->
        </div>
    </div>
</main>

<script>
    let allRooms = [];

    function renderFilteredRooms() {
        const list = document.getElementById('room-list');
        const query = (document.getElementById('room-filter').value || '').trim().toLowerCase();

        let filtered = allRooms.filter(r => {
            if (!query) return true;
            return (r.roomNumber || '').toLowerCase().includes(query) || 
                   (r.building || '').toLowerCase().includes(query);
        });

        if (filtered.length === 0) {
            ui.renderEmpty(list, 'ไม่พบห้องเรียนที่ตรงกับคำค้นหา');
            return;
        }

        list.innerHTML = '';
        filtered.forEach(r => {
            const item = document.createElement('div');
            item.style.padding = '14px 18px';
            item.style.background = 'var(--surface)';
            item.style.border = '1px solid var(--border-subtle)';
            item.style.borderLeft = '4px solid var(--teal-primary)';
            item.style.borderRadius = '8px';
            item.style.display = 'flex';
            item.style.justifyContent = 'space-between';
            item.style.alignItems = 'center';
            item.style.flexWrap = 'wrap';
            item.style.gap = '12px';

            item.innerHTML = `
                <div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="mono" style="font-weight:700; font-size:1.05rem; color:var(--ink-navy);">ห้อง ${ui.escapeHtml(r.roomNumber)}</span>
                        <span style="font-size:0.9rem; color:var(--ink-navy);">
                            อาคาร <strong style="color:var(--ink-navy);">${ui.escapeHtml(r.building || '-')}</strong> ชั้น <strong style="color:var(--ink-navy);">${r.floor || '-'}</strong>
                        </span>
                        <span class="muted mono" style="font-size:0.78rem;">ID: #${r.id}</span>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:0.85rem; font-weight:600; color:var(--teal-primary); background:var(--teal-50); padding:3px 12px; border-radius:4px; border:1px solid #CCFBF1;">
                        ความจุ <span class="num">${r.capacity || 0}</span> ที่นั่ง
                    </span>
                    <button type="button" class="btn btn--danger btn--sm" onclick="deleteRoom(${r.id}, '${ui.escapeHtml(r.building)} ${ui.escapeHtml(r.roomNumber)}')">
                        ลบ
                    </button>
                </div>
            `;
            list.appendChild(item);
        });
    }

    function deleteRoom(id, name) {
        ui.openDecisionSheet({
            title: `ยืนยันการลบห้องเรียน ${name}`,
            desc: `คุณกำลังจะลบห้องเรียน #${id} ออกจากระบบ`,
            impacts: ['ห้องเรียนนี้จะไม่สามารถนำมาจัดตารางสอนหรือตารางสอบได้อีก'],
            confirmText: 'ยืนยันลบห้องเรียน',
            confirmClass: 'btn--danger',
            onConfirm: async () => {
                const res = await api.del(`/api/v1/rooms/${id}`);
                if (res.ok) {
                    ui.toast('success', `ลบห้องเรียน ${name} เรียบร้อยแล้ว`);
                    await loadRooms();
                } else {
                    ui.toast('error', res.error.message || 'ไม่สามารถลบห้องเรียนได้');
                }
            }
        });
    }

    async function loadRooms() {
        const list = document.getElementById('room-list');
        ui.renderLoading(list, 3);
        const res = await api.get('/api/v1/rooms');
        if (!res.ok) {
            ui.renderError(list, res.error);
            return;
        }

        allRooms = Array.isArray(res.data) ? res.data : (res.data.content || []);
        document.getElementById('room-count').textContent = allRooms.length;
        renderFilteredRooms();
    }

    document.getElementById('create-room-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-create-room');
        ui.setBusy(btn, true);

        const payload = {
            roomNumber: document.getElementById('room-number').value.trim(),
            building: document.getElementById('room-building').value.trim(),
            floor: parseInt(document.getElementById('room-floor').value, 10),
            capacity: parseInt(document.getElementById('room-capacity').value, 10),
            isAvailable: true
        };

        const res = await api.post('/api/v1/rooms', payload);
        ui.setBusy(btn, false);

        if (res.ok) {
            ui.toast('success', `เพิ่มห้องเรียน ${payload.building} ${payload.roomNumber} สำเร็จ`);
            document.getElementById('create-room-form').reset();
            document.getElementById('room-floor').value = '2';
            document.getElementById('room-capacity').value = '50';
            await loadRooms();
        } else {
            ui.toast('error', res.error.message || 'เกิดข้อผิดพลาดในการสร้างห้องเรียน');
        }
    });

    loadRooms();
</script>
</body>
</html>
