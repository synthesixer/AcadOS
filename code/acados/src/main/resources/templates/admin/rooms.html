<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>จัดการห้องเรียน | AcadOS</title>
</head>
<body>
<main>
    <div class="page-header" style="margin-bottom:24px;">
        <h1>จัดการห้องเรียน (Rooms)</h1>
        <p class="muted">รายชื่อห้องเรียน อาคาร ชั้น และความจุที่นั่ง</p>
    </div>

    <div class="card">
        <h3>ห้องเรียนทั้งหมด</h3>
        <div id="room-list" style="margin-top:12px; display:grid; gap:8px;"></div>
    </div>
</main>

<script>
    async function loadRooms() {
        const list = document.getElementById('room-list');
        const res = await api.get('/api/v1/rooms?page=0&size=50');
        if (!res.ok) {
            list.innerHTML = `<p style="color:var(--danger);">${res.error.message}</p>`;
            return;
        }
        const rooms = (res.data && res.data.content) ? res.data.content : (Array.isArray(res.data) ? res.data : []);
        list.innerHTML = '';
        rooms.forEach(r => {
            const item = document.createElement('div');
            item.style.padding = '10px 14px';
            item.style.border = '1px solid var(--border)';
            item.style.borderRadius = '6px';
            item.style.display = 'flex';
            item.style.justifyContent = 'space-between';
            item.innerHTML = `<strong>ห้อง ${r.roomNumber}</strong> <span>อาคาร: ${r.building} ชั้น ${r.floor}</span> <span class="muted">ความจุ: ${r.capacity} คน</span>`;
            list.appendChild(item);
        });
    }
    loadRooms();
</script>
</body>
</html>
