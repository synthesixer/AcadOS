<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>จัดการผู้ใช้งาน | AcadOS</title>
</head>
<body>
<main>
    <div class="page-header" style="margin-bottom:24px;">
        <h1>จัดการผู้ใช้งาน (Users)</h1>
        <p class="muted">รายชื่อบัญชีผู้ใช้งานในระบบ (Admin, Teacher, Student)</p>
    </div>

    <div class="card">
        <h3>รายชื่อผู้ใช้ทั้งหมด</h3>
        <div id="user-list" style="margin-top:12px; display:grid; gap:8px;"></div>
    </div>
</main>

<script>
    async function loadUsers() {
        const list = document.getElementById('user-list');
        const res = await api.get('/api/v1/users?page=0&size=50');
        if (!res.ok) {
            list.innerHTML = `<p style="color:var(--danger);">${res.error.message}</p>`;
            return;
        }
        const users = (res.data && res.data.content) ? res.data.content : (Array.isArray(res.data) ? res.data : []);
        list.innerHTML = '';
        users.forEach(u => {
            const item = document.createElement('div');
            item.style.padding = '10px 14px';
            item.style.border = '1px solid var(--border)';
            item.style.borderRadius = '6px';
            item.style.display = 'flex';
            item.style.justifyContent = 'space-between';
            item.innerHTML = `<strong>${u.universityId}</strong> <span>${u.email}</span> <span class="muted">[${u.role}]</span>`;
            list.appendChild(item);
        });
    }
    loadUsers();
</script>
</body>
</html>
