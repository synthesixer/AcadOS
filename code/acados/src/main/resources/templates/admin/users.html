<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>จัดการผู้ใช้งาน | AcadOS</title>
</head>
<body>
<main>
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; margin-bottom:24px;">
        <div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                <span style="font-size:0.8rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--teal-primary);">Identity & Access Management</span>
            </div>
            <h1 style="font-size:1.75rem; font-weight:700; color:var(--ink-navy); margin:0;">จัดการผู้ใช้งาน (User Directory)</h1>
            <p class="muted" style="margin:4px 0 0; font-size:0.95rem;">รายชื่อบัญชีผู้ใช้งาน สิทธิ์การเข้าถึงระบบ และบทบาท (ADMIN, TEACHER, STUDENT)</p>
        </div>
    </div>

    <!-- Create User Card -->
    <div class="card" style="padding:22px; margin-bottom:24px;">
        <h3 style="margin:0 0 4px; font-size:1.15rem; color:var(--ink-navy);">สร้างบัญชีผู้ใช้งานใหม่</h3>
        <p class="muted" style="margin:0 0 16px; font-size:0.88rem;">กรอก University ID ชื่อ-สกุล อีเมล รหัสผ่านเริ่มต้น และเลือกบทบาทในระบบ</p>

        <form id="create-user-form" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; align-items:flex-end;">
            <div>
                <label for="user-uid" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">University ID *</label>
                <input id="user-uid" placeholder="เช่น 6733800001, T003" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div>
                <label for="user-fullname" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">ชื่อ-นามสกุล *</label>
                <input id="user-fullname" placeholder="เช่น ดร.ประเสริฐ ดีเลิศ" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div>
                <label for="user-email" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">อีเมล *</label>
                <input id="user-email" type="email" placeholder="เช่น user@univ.ac.th" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div>
                <label for="user-password" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">รหัสผ่าน *</label>
                <input id="user-password" type="password" placeholder="รหัสผ่านอย่างน้อย 6 ตัว" required
                       style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem;">
            </div>
            <div>
                <label for="user-role" style="display:block; font-size:0.85rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">บทบาท (Role) *</label>
                <select id="user-role" required
                        style="width:100%; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.88rem; background:var(--surface);">
                    <option value="STUDENT">นักศึกษา (STUDENT)</option>
                    <option value="TEACHER">อาจารย์ (TEACHER)</option>
                    <option value="ADMIN">ผู้ดูแลระบบ (ADMIN)</option>
                </select>
            </div>
            <div>
                <button class="btn btn--primary" type="submit" id="btn-create-user" style="width:100%; height:40px;">
                    + สร้างบัญชีผู้ใช้
                </button>
            </div>
        </form>
    </div>

    <!-- Status Ledger Role Filter -->
    <div class="status-ledger" style="margin-bottom:20px;">
        <button type="button" class="status-ledger__item is-active" id="filter-role-all" onclick="setRoleFilter('ALL')">
            <span class="status-ledger__dot" style="background:var(--ink-navy);"></span>
            <span>ทั้งหมด</span>
            <span class="status-ledger__count num" id="count-users-all">0</span>
        </button>
        <button type="button" class="status-ledger__item" id="filter-role-admin" onclick="setRoleFilter('ADMIN')">
            <span class="status-ledger__dot" style="background:var(--danger-red);"></span>
            <span>ผู้ดูแลระบบ (ADMIN)</span>
            <span class="status-ledger__count num" id="count-users-admin">0</span>
        </button>
        <button type="button" class="status-ledger__item" id="filter-role-teacher" onclick="setRoleFilter('TEACHER')">
            <span class="status-ledger__dot" style="background:var(--teal-primary);"></span>
            <span>อาจารย์ (TEACHER)</span>
            <span class="status-ledger__count num" id="count-users-teacher">0</span>
        </button>
        <button type="button" class="status-ledger__item" id="filter-role-student" onclick="setRoleFilter('STUDENT')">
            <span class="status-ledger__dot" style="background:var(--ok-green);"></span>
            <span>นักศึกษา (STUDENT)</span>
            <span class="status-ledger__count num" id="count-users-student">0</span>
        </button>
    </div>

    <!-- Users Workbench -->
    <div class="card" style="padding:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
            <div style="display:flex; align-items:center; gap:8px;">
                <h3 style="margin:0; font-size:1.1rem; color:var(--ink-navy);">บัญชีผู้ใช้ในระบบ</h3>
                <span class="muted" style="font-size:0.85rem;" id="user-count-label">แสดงทุกบทบาท</span>
            </div>
            <div>
                <input type="text" id="user-search" placeholder="ค้นหา University ID, ชื่อ หรืออีเมล..." 
                       style="padding:7px 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.88rem; width:260px;"
                       oninput="renderFilteredUsers()">
            </div>
        </div>

        <div id="user-list" style="display:grid; gap:10px;">
            <!-- Rendered by JS -->
        </div>
    </div>
</main>

<script>
    let allUsers = [];
    let currentRoleFilter = 'ALL';

    function setRoleFilter(role) {
        currentRoleFilter = role;
        document.querySelectorAll('.status-ledger__item').forEach(el => el.classList.remove('is-active'));
        if (role === 'ALL') document.getElementById('filter-role-all').classList.add('is-active');
        if (role === 'ADMIN') document.getElementById('filter-role-admin').classList.add('is-active');
        if (role === 'TEACHER') document.getElementById('filter-role-teacher').classList.add('is-active');
        if (role === 'STUDENT') document.getElementById('filter-role-student').classList.add('is-active');
        renderFilteredUsers();
    }

    function getRoleBadge(role) {
        if (role === 'ADMIN') return '<span class="badge badge--danger">ADMIN</span>';
        if (role === 'TEACHER') return '<span class="badge badge--primary">TEACHER</span>';
        if (role === 'STUDENT') return '<span class="badge badge--ok">STUDENT</span>';
        return `<span class="badge badge--neutral">${role}</span>`;
    }

    function renderFilteredUsers() {
        const list = document.getElementById('user-list');
        const query = (document.getElementById('user-search').value || '').trim().toLowerCase();

        let filtered = allUsers.filter(u => {
            if (currentRoleFilter !== 'ALL' && u.role !== currentRoleFilter) return false;
            if (query) {
                const uid = (u.universityId || '').toLowerCase();
                const name = (u.fullName || '').toLowerCase();
                const email = (u.email || '').toLowerCase();
                if (!uid.includes(query) && !name.includes(query) && !email.includes(query)) return false;
            }
            return true;
        });

        if (filtered.length === 0) {
            ui.renderEmpty(list, 'ไม่พบบัญชีผู้ใช้ที่ตรงกับเงื่อนไขการค้นหา');
            return;
        }

        list.innerHTML = '';
        filtered.forEach(u => {
            const item = document.createElement('div');
            item.style.padding = '14px 18px';
            item.style.background = 'var(--surface)';
            item.style.border = '1px solid var(--border-subtle)';
            item.style.borderRadius = '8px';
            item.style.display = 'flex';
            item.style.justifyContent = 'space-between';
            item.style.alignItems = 'center';
            item.style.flexWrap = 'wrap';
            item.style.gap = '12px';

            const borderColors = {
                ADMIN: 'var(--danger-red)',
                TEACHER: 'var(--teal-primary)',
                STUDENT: 'var(--ok-green)'
            };
            item.style.borderLeft = `4px solid ${borderColors[u.role] || 'var(--slate-neutral)'}`;

            item.innerHTML = `
                <div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="mono" style="font-weight:700; font-size:1.05rem; color:var(--ink-navy);">${ui.escapeHtml(u.universityId)}</span>
                        ${getRoleBadge(u.role)}
                        <strong style="color:var(--ink-navy); font-size:0.95rem;">${ui.escapeHtml(u.fullName || '')}</strong>
                    </div>
                    <div class="muted" style="font-size:0.85rem; margin-top:4px;">
                        อีเมล: <span class="mono" style="color:var(--ink-navy);">${ui.escapeHtml(u.email || '-')}</span>
                        <span class="muted mono" style="font-size:0.75rem; margin-left:8px;">ID: #${u.id}</span>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <button type="button" class="btn btn--danger btn--sm" onclick="deleteUser(${u.id}, '${ui.escapeHtml(u.universityId)}')">
                        ลบผู้ใช้
                    </button>
                </div>
            `;
            list.appendChild(item);
        });
    }

    function deleteUser(id, uid) {
        ui.openDecisionSheet({
            title: `ยืนยันลบบัญชีผู้ใช้ ${uid}`,
            desc: `คุณกำลังจะลบบัญชีผู้ใช้ #${id} ออกจากระบบ`,
            impacts: ['ผู้ใช้งานนี้จะไม่สามารถเข้าสู่ระบบหรือเข้าถึงข้อมูลได้อีกต่อไป'],
            confirmText: 'ยืนยันลบผู้ใช้',
            confirmClass: 'btn--danger',
            onConfirm: async () => {
                const res = await api.del(`/api/v1/users/${id}`);
                if (res.ok) {
                    ui.toast('success', `ลบบัญชีผู้ใช้ ${uid} สำเร็จ`);
                    await loadUsers();
                } else {
                    ui.toast('error', res.error.message || 'ไม่สามารถลบบัญชีผู้ใช้ได้');
                }
            }
        });
    }

    async function loadUsers() {
        const list = document.getElementById('user-list');
        ui.renderLoading(list, 3);
        const res = await api.get('/api/v1/users?page=0&size=100');
        if (!res.ok) {
            ui.renderError(list, res.error);
            return;
        }

        allUsers = (res.data && res.data.content) ? res.data.content : (Array.isArray(res.data) ? res.data : []);

        // Count per role
        document.getElementById('count-users-all').textContent = allUsers.length;
        document.getElementById('count-users-admin').textContent = allUsers.filter(u => u.role === 'ADMIN').length;
        document.getElementById('count-users-teacher').textContent = allUsers.filter(u => u.role === 'TEACHER').length;
        document.getElementById('count-users-student').textContent = allUsers.filter(u => u.role === 'STUDENT').length;

        renderFilteredUsers();
    }

    document.getElementById('create-user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-create-user');
        ui.setBusy(btn, true);

        const payload = {
            universityId: document.getElementById('user-uid').value.trim(),
            fullName: document.getElementById('user-fullname').value.trim(),
            email: document.getElementById('user-email').value.trim(),
            password: document.getElementById('user-password').value,
            role: document.getElementById('user-role').value
        };

        const res = await api.post('/api/v1/users', payload);
        ui.setBusy(btn, false);

        if (res.ok) {
            ui.toast('success', `สร้างบัญชีผู้ใช้ ${payload.universityId} สำเร็จ`);
            document.getElementById('create-user-form').reset();
            await loadUsers();
        } else {
            ui.toast('error', res.error.message || 'เกิดข้อผิดพลาดในการสร้างบัญชีผู้ใช้');
        }
    });

    loadUsers();
</script>
</body>
</html>
