<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>รายวิชาที่ลงทะเบียน | AcadOS</title>
</head>
<body>
<main>
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; margin-bottom:24px;">
        <div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                <span style="font-size:0.8rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--teal-primary);">Enrollment Ledger</span>
            </div>
            <h1 style="font-size:1.75rem; font-weight:700; color:var(--ink-navy); margin:0;">รายวิชาที่ลงทะเบียน (My Registrations)</h1>
            <p class="muted" style="margin:4px 0 0; font-size:0.95rem;">ตรวจสอบสถานะกลุ่มเรียนที่ลงทะเบียนไว้ และจัดการการถอนรายวิชา</p>
        </div>
        <div>
            <a th:href="@{/student/courses}" class="btn btn--primary" style="font-size:0.88rem;">
                + ลงทะเบียนเพิ่ม
            </a>
        </div>
    </div>

    <!-- Registrations Workbench Card -->
    <div class="card" style="padding:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h3 style="margin:0; font-size:1.1rem; color:var(--ink-navy);">รายการวิชาที่ลงทะเบียนในภาคการศึกษานี้</h3>
            <span class="muted" style="font-size:0.85rem;" id="reg-count">กำลังโหลด...</span>
        </div>

        <div id="my-registrations" style="display:grid; gap:12px;">
            <!-- Rendered by JS -->
        </div>
    </div>
</main>

<script>
    function confirmDropRegistration(r) {
        ui.openDecisionSheet({
            title: `ยืนยันการถอนรายวิชา ${r.courseCode || 'วิชา'} (กลุ่ม ${r.sectionNumber})`,
            desc: 'คุณกำลังจะถอนรายวิชานี้ออกจากแผนการเรียน กรุณาตรวจสอบผลกระทบก่อนยืนยัน',
            impacts: [
                'ที่นั่งในกลุ่มเรียนจะถูกคืนสู่ระบบทันทีเพื่อให้นักศึกษาท่านอื่นสามารถลงทะเบียนได้',
                'รายวิชานี้จะถูกนำออกจากตารางเรียนของคุณ',
                'การดำเนินการนี้ไม่สามารถย้อนกลับได้โดยอัตโนมัติ หากต้องการลงใหม่ต้องมีที่นั่งว่าง'
            ],
            confirmText: 'ยืนยันถอนรายวิชา',
            confirmClass: 'btn--danger',
            onConfirm: async () => {
                const res = await api.del(`/api/v1/registrations/${r.id}`);
                if (res.ok) {
                    ui.toast('success', `ถอนรายวิชา ${r.courseCode} สำเร็จ`);
                    await loadMyRegistrations();
                } else {
                    ui.toast('error', res.error.message || 'เกิดข้อผิดพลาดในการถอนรายวิชา');
                }
            }
        });
    }

    async function loadMyRegistrations() {
        const list = document.getElementById('my-registrations');
        ui.renderLoading(list, 2);
        const res = await api.get('/api/v1/registrations/my');
        if (!res.ok) {
            ui.renderError(list, res.error);
            return;
        }

        const regs = Array.isArray(res.data) ? res.data : (res.data.content || []);
        document.getElementById('reg-count').textContent = `ทั้งหมด ${regs.length} รายวิชา`;

        if (regs.length === 0) {
            ui.renderEmpty(list, 'คุณยังไม่ได้ลงทะเบียนรายวิชาใดๆ ในภาคการศึกษานี้');
            return;
        }

        list.innerHTML = '';
        regs.forEach(r => {
            const card = document.createElement('div');
            card.style.padding = '16px 20px';
            card.style.background = 'var(--surface)';
            card.style.border = '1px solid var(--border-subtle)';
            card.style.borderLeft = '4px solid var(--ok-green)';
            card.style.borderRadius = '8px';
            card.style.display = 'flex';
            card.style.justifyContent = 'space-between';
            card.style.alignItems = 'center';
            card.style.flexWrap = 'wrap';
            card.style.gap = '14px';

            card.innerHTML = `
                <div style="flex:1; min-width:240px;">
                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                        <span class="mono" style="font-weight:700; font-size:1.1rem; color:var(--ink-navy);">${ui.escapeHtml(r.courseCode || '')}</span>
                        <span style="font-size:0.85rem; font-weight:600; color:var(--slate-neutral); background:var(--bg-canvas); padding:2px 8px; border-radius:4px; border:1px solid var(--border-subtle);">
                            กลุ่ม ${r.sectionNumber}
                        </span>
                        <span class="badge badge--ok">ลงทะเบียนแล้ว</span>
                    </div>
                    <div style="font-size:0.95rem; font-weight:500; color:var(--ink-navy); margin-bottom:4px;">
                        ${ui.escapeHtml(r.courseTitle || 'ไม่มีชื่อวิชา')}
                    </div>
                    <div class="muted" style="font-size:0.85rem;">
                        ลงทะเบียนเมื่อ: <span class="mono">${r.registeredAt ? r.registeredAt.replace('T', ' ').substring(0, 16) : '-'}</span>
                    </div>
                </div>
                <div>
                    <button type="button" class="btn btn--danger btn--sm" onclick='confirmDropRegistration(${JSON.stringify(r)})'>
                        ถอนวิชา
                    </button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    loadMyRegistrations();
</script>
</body>
</html>
