<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>ค้นหาและลงทะเบียนเรียน | AcadOS</title>
</head>
<body>
<main>
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; margin-bottom:24px;">
        <div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                <span style="font-size:0.8rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--teal-primary);">Student Operations · Scenario 1</span>
            </div>
            <h1 style="font-size:1.75rem; font-weight:700; color:var(--ink-navy); margin:0;">ค้นหาและลงทะเบียนเรียน (Course Registration)</h1>
            <p class="muted" style="margin:4px 0 0; font-size:0.95rem;">เลือกกลุ่มเรียนที่เปิดสอน ตรวจสอบความจุที่นั่ง และกดลงทะเบียนตามข้อกำหนดหลักสูตร</p>
        </div>
        <div>
            <a th:href="@{/student/registrations}" class="btn btn--secondary" style="font-size:0.88rem;">
                ดูวิชาที่ลงทะเบียนแล้ว →
            </a>
        </div>
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="card" style="padding:16px 20px; margin-bottom:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <div style="display:flex; gap:12px; align-items:center; flex:1; min-width:280px;">
                <input type="text" id="course-search" placeholder="ค้นหารหัสวิชา (e.g. CP353002) หรือชื่อวิชา..." 
                       style="padding:9px 14px; border:1px solid var(--border-subtle); border-radius:6px; font-size:0.9rem; flex:1;"
                       oninput="renderSections()">
            </div>
            <div style="display:flex; gap:8px;">
                <button type="button" class="btn btn--secondary btn--sm" id="btn-refresh" onclick="loadSections()">
                    🔄 รีเฟรชข้อมูล
                </button>
            </div>
        </div>
    </div>

    <!-- Course Section Ledger Cards -->
    <div class="card" style="padding:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h3 style="margin:0; font-size:1.1rem; color:var(--ink-navy);">กลุ่มเรียนที่เปิดรับลงทะเบียน</h3>
            <span class="muted" style="font-size:0.85rem;" id="results-count">กำลังโหลด...</span>
        </div>

        <div id="section-grid" style="display:grid; gap:12px;">
            <!-- Rendered by JS -->
        </div>
    </div>
</main>

<script>
    let allSections = [];
    let myRegistrationsMap = new Map();
    let myCourseRegistrations = new Map();

    async function registerSection(btn, sectionId, courseCode, sectionNumber) {
        ui.setBusy(btn, true);
        try {
            const res = await api.post('/api/v1/registrations', { sectionId: sectionId });
            if (res.ok) {
                ui.toast('success', `ลงทะเบียนรายวิชา ${courseCode} (กลุ่ม ${sectionNumber}) สำเร็จเรียบร้อย`);
                await loadSections();
                ui.refreshUnreadCount();
            } else {
                let msg = res.error.message || 'เกิดข้อผิดพลาดในการลงทะเบียน';
                const lower = msg.toLowerCase();
                if (lower.includes('conflict') || (res.error.code && res.error.code.includes('CONFLICT'))) {
                    msg = `ลงทะเบียนไม่ได้: ช่วงเวลานี้ชนกับรายวิชาอื่นในตารางเรียนของคุณ`;
                } else if (lower.includes('duplicate') || lower.includes('already') || (res.error.code && res.error.code.includes('ALREADY'))) {
                    msg = `ลงทะเบียนไม่ได้: คุณได้ลงทะเบียนในรายวิชานี้แล้ว`;
                } else if (lower.includes('capacity') || lower.includes('full') || (res.error.code && res.error.code.includes('FULL'))) {
                    msg = `ลงทะเบียนไม่ได้: กลุ่มเรียนนี้เต็มตามความจุที่กำหนดแล้ว`;
                }
                ui.toast('error', msg);
            }
        } catch (e) {
            ui.toast('error', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบเครือข่าย');
        } finally {
            ui.setBusy(btn, false);
        }
    }

    async function dropSection(btn, regId, courseCode, sectionNumber) {
        ui.openDecisionSheet({
            title: `ถอนรายวิชา ${courseCode} (กลุ่ม ${sectionNumber})`,
            desc: 'คุณกำลังจะถอนการลงทะเบียนในกลุ่มเรียนนี้ ที่นั่งจะถูกคืนให้ผู้อื่นทันที',
            impacts: [
                'รายวิชานี้จะถูกนำออกจากตารางเรียนของคุณทันที',
                'ที่นั่งจะว่างลงและนักศึกษาท่านอื่นสามารถลงทะเบียนแทนได้'
            ],
            confirmText: 'ยืนยันถอนรายวิชา',
            confirmClass: 'btn--danger',
            onConfirm: async () => {
                const res = await api.del(`/api/v1/registrations/${regId}`);
                if (res.ok) {
                    ui.toast('success', `ถอนรายวิชา ${courseCode} เรียบร้อยแล้ว`);
                    await loadSections();
                    ui.refreshUnreadCount();
                } else {
                    ui.toast('error', res.error.message || 'ถอนรายวิชาไม่สำเร็จ');
                }
            }
        });
    }

    function renderSections() {
        const grid = document.getElementById('section-grid');
        const query = (document.getElementById('course-search').value || '').trim().toLowerCase();

        let filtered = allSections.filter(s => {
            if (!query) return true;
            const code = (s.courseCode || '').toLowerCase();
            const title = (s.courseTitle || '').toLowerCase();
            const sec = String(s.sectionNumber || '');
            return code.includes(query) || title.includes(query) || sec.includes(query);
        });

        const enrolledCount = myRegistrationsMap.size;
        document.getElementById('results-count').textContent = `พบ ${filtered.length} รายการ (คุณลงทะเบียนแล้ว ${enrolledCount} วิชา)`;

        if (filtered.length === 0) {
            ui.renderEmpty(grid, 'ไม่พบกลุ่มเรียนที่ตรงกับคำค้นหา หรือยังไม่มีรายวิชาเปิดรับลงทะเบียนในขณะนี้');
            return;
        }

        grid.innerHTML = '';
        filtered.forEach(s => {
            const isEnrolled = myRegistrationsMap.has(s.id);
            const enrolledReg = myRegistrationsMap.get(s.id);
            const enrolledOtherSection = !isEnrolled && s.courseCode && myCourseRegistrations.has(s.courseCode.toUpperCase());
            const isActive = s.status === 'ACTIVE';

            const card = document.createElement('div');
            card.style.padding = '18px 20px';
            card.style.borderRadius = '8px';
            card.style.display = 'flex';
            card.style.justifyContent = 'space-between';
            card.style.alignItems = 'center';
            card.style.flexWrap = 'wrap';
            card.style.gap = '14px';
            card.style.transition = 'all 0.2s ease';

            if (isEnrolled) {
                card.style.background = '#F0FDF4';
                card.style.border = '2px solid #86EFAC';
                card.style.borderLeft = '6px solid #16A34A';
                card.style.boxShadow = '0 2px 8px rgba(22, 163, 74, 0.12)';
            } else {
                card.style.background = 'var(--surface)';
                card.style.border = '1px solid var(--border-subtle)';
                card.style.borderLeft = isActive ? '4px solid var(--teal-primary)' : '4px solid var(--slate-neutral)';
            }

            card.innerHTML = `
                <div style="flex:1; min-width:240px;">
                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;">
                        <span class="mono" style="font-weight:700; font-size:1.15rem; color:var(--ink-navy);">${ui.escapeHtml(s.courseCode || 'วิชา')}</span>
                        <span style="font-size:0.85rem; font-weight:600; color:var(--slate-neutral); background:var(--bg-canvas); padding:2px 8px; border-radius:4px; border:1px solid var(--border-subtle);">
                            กลุ่ม ${s.sectionNumber}
                        </span>
                        ${ui.badge(s.status)}
                        ${isEnrolled ? `
                            <span class="badge badge--ok" style="background:#DCFCE7; color:#166534; border:1px solid #86EFAC; font-weight:700; font-size:0.85rem; padding:3px 10px;">
                                ✔ ลงทะเบียนแล้ว (Enrolled)
                            </span>
                        ` : ''}
                        ${enrolledOtherSection ? `
                            <span class="badge badge--warn" style="font-size:0.8rem;">
                                ⚠ ลงทะเบียนกลุ่ม ${myCourseRegistrations.get(s.courseCode.toUpperCase()).sectionNumber} แล้ว
                            </span>
                        ` : ''}
                    </div>
                    <div style="font-size:1rem; font-weight:600; color:var(--ink-navy); margin-bottom:6px;">
                        ${ui.escapeHtml(s.courseTitle || 'ไม่มีชื่อวิชา')}
                    </div>
                    <div class="muted" style="font-size:0.85rem; display:flex; align-items:center; gap:16px;">
                        <span>ความจุที่นั่ง: <span class="num" style="font-weight:600; color:var(--ink-navy);">${s.capacity || 0}</span> ที่นั่ง</span>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    ${isEnrolled ? `
                        <button type="button" class="btn btn--secondary" disabled style="background:#E2E8F0; color:#334155; font-weight:700; cursor:default; opacity:1;">
                            ✔ ลงทะเบียนแล้ว
                        </button>
                        <button type="button" class="btn btn--danger btn--sm" 
                                onclick="dropSection(this, ${enrolledReg.id}, '${ui.escapeHtml(s.courseCode || '')}', '${s.sectionNumber}')">
                            ถอนรายวิชา
                        </button>
                    ` : (isActive ? `
                        <button type="button" class="btn btn--primary" 
                                onclick="registerSection(this, ${s.id}, '${ui.escapeHtml(s.courseCode || '')}', '${s.sectionNumber}')">
                            ลงทะเบียนเรียน
                        </button>
                    ` : `
                        <button type="button" class="btn btn--secondary" disabled style="opacity:0.6;">
                            ปิดรับลงทะเบียน
                        </button>
                    `)}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    async function loadSections() {
        const grid = document.getElementById('section-grid');
        ui.renderLoading(grid, 3);

        const [secRes, regRes] = await Promise.all([
            api.get('/api/v1/sections'),
            api.get('/api/v1/registrations/my', { redirectOn401: false })
        ]);

        if (!secRes.ok) {
            ui.renderError(grid, secRes.error);
            return;
        }

        allSections = Array.isArray(secRes.data) ? secRes.data : (secRes.data.content || []);

        myRegistrationsMap.clear();
        myCourseRegistrations.clear();
        if (regRes && regRes.ok && Array.isArray(regRes.data)) {
            regRes.data.forEach(r => {
                myRegistrationsMap.set(r.sectionId, r);
                if (r.courseCode) {
                    myCourseRegistrations.set(r.courseCode.toUpperCase(), r);
                }
            });
        }

        renderSections();
    }

    loadSections();
</script>
</body>
</html>
