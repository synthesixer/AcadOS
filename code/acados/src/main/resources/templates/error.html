<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เกิดข้อผิดพลาด | AcadOS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg-canvas);
            padding: var(--space-4);
        }
        .error-card {
            width: min(100%, 520px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }
        .error-code {
            font-family: var(--font-mono);
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<main class="error-card">
    <div style="display:flex; justify-content:center; margin-bottom:16px;">
        <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#102A43"/>
            <path d="M7 26C8.5 17 12 8 16 5C17.5 7.5 19 11 20 15" stroke="#0B766E" stroke-width="2.8" stroke-linecap="round"/>
            <path d="M25 26C23.5 17 20 8 16 5" stroke="#14B8A6" stroke-width="2.8" stroke-linecap="round"/>
            <path d="M9 19C13 17 19 17 23 19" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
    </div>

    <div class="error-code" th:text="${status} ?: '404'">404</div>
    <h1 style="font-size:1.4rem; color:var(--ink-navy); margin-bottom:8px;" th:text="${error} ?: 'ไม่พบหน้าที่ต้องการ'">
        ไม่พบหน้าที่ต้องการ
    </h1>
    <p class="muted" style="font-size:0.92rem; margin-bottom:28px; line-height:1.5;" th:text="${message} ?: 'หน้าที่คุณกำลังเข้าถึงอาจถูกย้าย ลบ หรือคุณอาจไม่มีสิทธิ์เข้าถึงในส่วนนี้'">
        หน้าที่คุณกำลังเข้าถึงอาจถูกย้าย ลบ หรือคุณอาจไม่มีสิทธิ์เข้าถึงในส่วนนี้
    </p>

    <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
        <a th:href="@{/}" class="btn btn--primary">
            กลับหน้าหลัก (Home)
        </a>
        <a th:href="@{/login}" class="btn btn--secondary">
            เข้าสู่ระบบใหม่ (Sign In)
        </a>
    </div>
</main>
</body>
</html>
